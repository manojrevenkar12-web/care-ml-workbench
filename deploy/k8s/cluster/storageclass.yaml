# Cluster-level, applied once per cluster after Terraform (fileSystemId from `terraform output efs_file_system_id`).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-encrypted
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-REPLACE_ME
  directoryPerms: "750"
  uid: "10001"
  gid: "10001"
