name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build and test (unit, API, PostgreSQL and OpenFGA via Testcontainers)
        run: ../.github/run.sh gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/*/build/reports/tests
          retention-days: 7

  trainer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: ../.github/run.sh python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: ../.github/run.sh npm run typecheck
      - run: ../.github/run.sh npm test
      - run: ../.github/run.sh npm run build

  e2e:
    # the built web app against the real Ktor API (demo seed, local Python trainer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r trainer/requirements.txt
      - run: gradle --no-daemon -p backend :api:installDist
      - name: Start the API
        run: |
          DEV_AUTH=true SEED_DEMO=true TRAINER_MODE=local ARTIFACT_DIR=build/e2e-artifacts \
            nohup backend/api/build/install/api/bin/api > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/ready && break; sleep 2; done
          curl -sf localhost:8080/ready || { tail -50 api.log; exit 1; }
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
      - working-directory: frontend
        run: CI=1 ../.github/run.sh npx playwright test --reporter=line
      - if: failure()
        run: tail -100 api.log

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format and validate
        working-directory: deploy/terraform
        run: |
          ../../.github/run.sh terraform fmt -check -diff -recursive
          terraform init -backend=false -input=false
          ../../.github/run.sh terraform validate
      - name: Kubernetes manifests (both regions)
        run: |
          for o in eu us; do
            kubectl kustomize deploy/k8s/overlays/$o > /tmp/$o.yaml
            docker run --rm -v /tmp:/m ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas /m/$o.yaml
          done
          docker run --rm -v "$PWD/deploy/k8s/cluster:/m" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /m
      - name: Compose file
        run: docker compose config --quiet
      - name: Build images
        run: |
          docker build -f backend/Dockerfile --target api -t cmw-api .
          docker build -f backend/Dockerfile --target etl -t cmw-etl .
          docker build -f backend/Dockerfile --target dev -t cmw-api-dev .
          docker build -t cmw-web frontend
          docker build -t cmw-trainer trainer
      - name: Smoke-test the web image headers
        run: |
          docker run -d --name web -p 8081:8080 -e API_UPSTREAM=http://127.0.0.1:9 cmw-web
          sleep 2
          curl -sI localhost:8081/ | tee /tmp/h.txt
          grep -qi "content-security-policy: default-src 'self'" /tmp/h.txt
          curl -sI localhost:8081/assets/ | grep -qi "x-content-type-options: nosniff"
